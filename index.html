function fieldHtml(f){const v=f.value==null?'':f.value;let h;
 if(f.type==='select')h=`<select name="${f.name}">${opts(f.options||[],v)}</select>`;
 else if(f.type==='textarea')h=`<textarea name="${f.name}" rows="3" placeholder="${esc(f.placeholder||'')}">${esc(v)}</textarea>`;
 else h=`<input name="${f.name}" type="${f.type||'text'}" value="${esc(v)}" ${f.type==='number'?'step="0.01" inputmode="decimal"'+(f.min!==undefined?` min="${f.min}"`:''):''} placeholder="${esc(f.placeholder||'')}">`;
 return fl(esc(f.label),h,f.full?'full':'')}
function formModal(icon,title,sub,fields,o={}){return new Promise(res=>{const m=$('modal');
 m.innerHTML=`<div class="mc">${hd(icon,esc(title),sub||'','',o.danger?'red':'')}${o.message?`<p>${o.message}</p>`:''}<form id="mf" novalidate>${fields.length?`<div class="grid">${fields.map(fieldHtml).join('')}</div>`:''}
  <div class="btns end"><button type="button" class="btn" id="mx">Cancel</button><button type="submit" class="btn ${o.danger?'dd':'p'}">${esc(o.submit||'Save')}</button></div></form></div>`;
 m.classList.add('open');const f=$('mf');
 const close=v=>{m.classList.remove('open');m.innerHTML='';document.removeEventListener('keydown',key);res(v)},key=e=>{if(e.key==='Escape')close(null)};
 document.addEventListener('keydown',key);$('mx').onclick=()=>close(null);m.onclick=e=>{if(e.target===m)close(null)};
 f.onsubmit=e=>{e.preventDefault();const miss=fields.find(x=>x.required&&!String(f.elements[x.name].value).trim());
  if(miss){toast(miss.label+' is required.',true);f.elements[miss.name].focus();return}
  const v={};fields.forEach(x=>v[x.name]=f.elements[x.name].value);close(v)};
 const first=f.querySelector('input,select,textarea');if(first)first.focus()})}
const confirmModal=(t,msg,btn)=>formModal('trash',t,'This cannot be undone',[],{message:msg,submit:btn||'Delete',danger:true});

async function projectForm(p={}){const v=await formModal('target',p.ID?'Edit Project':'New Project','A bigger plan with a budget and target date',[
 {name:'Name',label:'Project name',value:p.Name,required:true,full:true,placeholder:'e.g. Home solar system'},
 {name:'Budget',label:`Total budget (${sym()})`,type:'number',min:0,value:p.Budget,placeholder:'Blank = sum of its items'},
 {name:'SetAside',label:'Already saved',type:'number',min:0,value:p.SetAside,placeholder:'0.00'},
 {name:'StartDate',label:'Start date',type:'date',value:p.StartDate||S.data.today},{name:'TargetDate',label:'Target date',type:'date',value:p.TargetDate},
 {name:'Priority',label:'Priority',type:'select',options:PRIORITIES,value:p.Priority||'Medium'},{name:'Status',label:'Status',type:'select',options:PROJECT_STATUSES,value:p.Status||'Planned'},
 {name:'Description',label:'Notes',type:'textarea',value:p.Description,full:true,placeholder:'What it involves, quotes received…'}]);
 if(v)mutate('saveProject',[{...v,ID:p.ID||''}],p.ID?'Project updated':'Project created')}
async function purchaseForm(x={},pid){const projects=S.data.Projects.filter(p=>openProject(p)||String(p.ID)===String(x.ProjectID));
 const v=await formModal('cart',x.ID?'Edit Planned Purchase':'Plan a Purchase','Something you intend to buy',[
 {name:'Item',label:'Item',value:x.Item,required:true,full:true,placeholder:'e.g. 5kVA inverter'},
 {name:'EstCost',label:`Estimated cost (${sym()})`,type:'number',min:0,value:x.EstCost,required:true,placeholder:'0.00'},
 {name:'SavedSoFar',label:'Saved so far',type:'number',min:0,value:x.SavedSoFar,placeholder:'0.00'},
 {name:'TargetDate',label:'Buy by',type:'date',value:x.TargetDate},{name:'Priority',label:'Priority',type:'select',options:PRIORITIES,value:x.Priority||'Medium'},
 {name:'Status',label:'Status',type:'select',options:PURCHASE_STATUSES,value:x.Status||'Planned'},
 {name:'ProjectID',label:'Part of project',type:'select',options:[{value:'',label:'— None —'}].concat(projects.map(p=>({value:p.ID,label:p.Name}))),value:x.ProjectID||pid||''},
 {name:'Notes',label:'Notes',type:'textarea',value:x.Notes,full:true,placeholder:'Shop, model, link…'}]);
 if(v)mutate('savePurchase',[{...v,ID:x.ID||''}],x.ID?'Purchase updated':'Purchase planned')}
async function catForm(c={},ty){const v=await formModal('tag',c.ID?'Edit Category':'New Category','Used to group income and expenses',[
 {name:'Name',label:'Name',value:c.Name,required:true,full:true},{name:'Type',label:'Type',type:'select',options:['Expense','Income'],value:c.Type||ty||'Expense'},
 {name:'Color',label:'Colour',type:'color',value:c.Color||PALETTE[Math.floor(Math.random()*PALETTE.length)]}].concat(c.ID?[]:
 [{name:'MonthlyBudget',label:`Monthly limit (${sym()}) — expenses only`,type:'number',min:0,full:true,placeholder:'Leave blank for no limit'}]),
 c.ID&&c.Type==='Expense'?{message:'To change this category\'s monthly limit, use <b>Set limit</b> on the Budgets page — changes apply from the month you choose onwards.'}:{});
 if(!v)return;if(v.Type==='Income')v.MonthlyBudget=0;mutate('saveCategory',[{...v,ID:c.ID||''}],'Category saved')}
async function accForm(a={}){const v=await formModal('bank',a.ID?'Edit Account':'New Account','Cash, mobile money, bank or savings',[
 {name:'Name',label:'Account name',value:a.Name,required:true,full:true,placeholder:'e.g. MTN MoMo, GCB Current'},
 {name:'Type',label:'Type',type:'select',options:ACCOUNT_TYPES,value:a.Type||'Bank'},{name:'OpeningBalance',label:`Opening balance (${sym()})`,type:'number',value:a.OpeningBalance||0},
 {name:'SmsMatch',label:'SMS match (comma-separated)',value:a.SmsMatch,full:true,placeholder:'e.g. MobileMoney  ·  GCB, 4521 (sender name or last 4 digits)'}]);
 if(v)mutate('saveAccount',[{...v,ID:a.ID||''}],'Account saved')}
function csv(){const r=filteredTx();if(!r.length)return toast('Nothing to export',true);
 const k=['Date','Type','Category','Amount','Account','ToAccount','Description'],q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([[k.join(','),...r.map(x=>k.map(c=>q(x[c])).join(','))].join('\n')],{type:'text/csv'}));
 a.download='transactions-'+(S.f.all?'all':S.month)+'.csv';a.click()}

/* ================================================================
   Actions
   ================================================================ */
const A={
 go:id=>go(id),menu:id=>menu(id),
 prevMonth:()=>{S.month=addMonths(S.month,-1);render()},nextMonth:()=>{S.month=addMonths(S.month,1);render()},
 quickAdd:()=>{S.edit=null;S.draft=null;if(S.tab!=='tx')go('tx');else renderTxForm();setTimeout(()=>{const f=$('txf');if(f){f.scrollIntoView({behavior:'smooth',block:'start'});f.elements.Amount.focus()}},50)},
 txType:id=>{S.draft=readTxForm();S.txType=id;renderTxForm()},
 cancelEdit:()=>{S.edit=null;S.draft=null;renderTxForm()},
 editTx:id=>{const t=byId('Transactions',id);if(!t)return;S.edit=t;S.draft=null;S.txType=t.Type;renderTxForm();$('main').scrollTo({top:0,behavior:'smooth'})},
 delTx:async id=>{const t=byId('Transactions',id);if(await confirmModal('Delete Transaction?',`<b>${esc(t.Description||t.Category)}</b> — ${fmt(t.Amount)} on ${niceDate(t.Date)}`)){if(S.edit&&S.edit.ID===id)S.edit=null;mutate('deleteTransaction',[id],'Transaction deleted')}},
 csv:()=>csv(),
 iv:id=>{S.iv=id;render()},
 refresh:async()=>{try{S.data=await run('refreshData');render();toast('Up to date')}catch(e){toast(e.message||String(e),true)}},
 setCat:(id,b)=>{const row=b.closest('.ibx'),cat=row.querySelector('.ccat').value,rem=row.querySelector('.crem');if(!cat)return toast('Choose a category first.',true);
  const t=byId('Transactions',id),kw=rem&&rem.checked?String(t.Payee||t.Description||'').trim():'';mutate('categoriseTx',[id,cat,kw],kw?'Saved — future “'+kw+'” messages will be categorised automatically':'Category saved')},
 mirror:(id,b)=>mutate('makeTransfer',[id,b.dataset.acc,b.dataset.m],'Recorded as a transfer between your accounts'),
 ownTr:async id=>{const t=byId('Transactions',id),others=accNames().filter(a=>a!==t.Account);if(!others.length)return toast('Add your other accounts first.',true);
  const v=await formModal('swap','Transfer Between Your Accounts',`${fmt(t.Amount)} ${t.Type==='Income'?'came into':'left'} ${esc(t.Account)}`,[{name:'Other',label:t.Type==='Income'?'It came from':'It went to',type:'select',options:others,full:true}],{submit:'Make it a transfer',message:'This isn\'t income or spending — just money moving between your own accounts.'});
  if(!v)return;const m=mirrorOf(t);mutate('makeTransfer',[id,v.Other,m&&m.Account===v.Other?m.ID:''],'Recorded as a transfer')},
 recSms:async id=>{const l=smsLog().find(x=>String(x.ID)===String(id));const allCats=cats('Expense').map(c=>({value:c.Name,label:c.Name+' (expense)'})).concat(cats('Income').map(c=>({value:c.Name,label:c.Name+' (income)'})));
  const v=await formModal('check','Record This Message','Check the details the app picked up',[
   {name:'Type',label:'Type',type:'select',options:['Expense','Income'],value:l.Type||'Expense'},{name:'Amount',label:`Amount (${sym()})`,type:'number',min:0,value:l.Amount,required:true},
   {name:'Date',label:'Date',type:'date',value:l.SmsDate||S.data.today,required:true},{name:'Account',label:'Account',type:'select',options:accNames(),value:l.Account,required:true},
   {name:'Category',label:'Category',type:'select',options:allCats,value:UNCAT,full:true},{name:'Description',label:'Description',value:l.Payee||'',full:true}],{submit:'Record',message:`<span class="sms" style="display:block">${esc(l.Message)}</span>`});
  if(!v)return;const ok=cats(v.Type).some(c=>c.Name===v.Category);if(!ok)return toast('That category is for '+(v.Type==='Income'?'expenses':'income')+'.',true);mutate('recordFromSms',[id,v],'Recorded')},
 ignSms:id=>mutate('ignoreSms',[id],'Ignored'),
 copy:id=>copyField(id),
 newAppKey:async()=>{if(await formModal('alert','Unpair the Mobile App?','The app will need the new pairing code',[],{submit:'Unpair',danger:true,message:'Use this if your phone was lost or the pairing code was shared. Afterwards paste the new code into the app.'}))mutate('resetAppKey',[],'App unpaired — copy the new pairing code into the app')},
 newKey:async()=>{if(await formModal('alert','Generate a New Key?','Your phone will stop forwarding until you update it',[],{submit:'Generate',danger:true,message:'Use this if your forwarding address was shared by mistake. Afterwards, copy the new address into your SMS app.'}))mutate('resetSmsKey',[],'New key generated — update your phone')},
 addSms:async()=>{const f=$('tryF');if(!f.text.value.trim())return toast('Paste an SMS first.',true);
  try{const r=await run('addSms',f.text.value,f.from.value);S.data=r.data;const st=r.result.status;
   toast(st==='Recorded'?'Added to '+r.result.account:st==='Duplicate'?'Already added before':st==='Ignored'?'Skipped: '+r.result.note:'Saved to Needs review',st!=='Recorded'&&st!=='Duplicate');
   S.iv=st==='Recorded'?'cat':st==='Review'?'rev':S.iv;render()}catch(e){toast(e.message||String(e),true)}},
 addRule:async()=>{const allCats=cats('Expense').filter(c=>c.Name!==UNCAT).map(c=>({value:c.Name,label:c.Name+' (expense)'})).concat(cats('Income').filter(c=>c.Name!==UNCAT).map(c=>({value:c.Name,label:c.Name+' (income)'})));
  const v=await formModal('tag','New Auto-category Rule','When an SMS mentions this word, use this category',[{name:'Keyword',label:'Word or name in the SMS',required:true,full:true,placeholder:'e.g. KFC, Vodafone, school fees'},{name:'Category',label:'Category',type:'select',options:allCats,full:true}]);
  if(v)mutate('saveRule',[v],'Rule added')},
 delRule:id=>mutate('deleteRule',[id],'Rule deleted'),
 setBudget:async id=>{const c=byId('Categories',id),m=S.month,cur=budgetFor(c,m);
  const later=(S.data.Budgets||[]).filter(b=>b.Category===c.Name&&String(b.Month)>m).sort((a,b)=>String(a.Month).localeCompare(String(b.Month)))[0];
  const v=await formModal('target','Monthly Limit',esc(c.Name)+' · from '+monthLabel(m)+' onwards',[{name:'MonthlyBudget',label:`Monthly limit (${sym()})`,type:'number',min:0,value:cur||'',required:true,full:true,placeholder:'0 = no limit'}],
   {submit:'Save limit',message:`Applies to <b>${monthLabel(m)}</b> and every month after it${later?` until <b>${monthLabel(String(later.Month))}</b>, which has its own limit of ${fmt(later.Amount)}`:''}. Earlier months keep the limit they had.`});
  if(v)mutate('setBudget',[c.Name,m,v.MonthlyBudget],'Limit saved from '+monthLabel(m)+' onwards')},
 addCat:ty=>catForm({},ty),editCat:id=>catForm(byId('Categories',id)),
 delCat:async id=>{const c=byId('Categories',id);if(await confirmModal('Delete Category?',`<b>${esc(c.Name)}</b> will be removed. Existing transactions keep their category name.`))mutate('deleteCategory',[id],'Category deleted')},
 addAcc:()=>accForm(),editAcc:id=>accForm(byId('Accounts',id)),
 delAcc:async id=>{const a=byId('Accounts',id);if(await confirmModal('Delete Account?',`Delete <b>${esc(a.Name)}</b>? This only works if it has no transactions.`))mutate('deleteAccount',[id],'Account deleted')},
 pv:id=>{S.pv=id;render()},uv:id=>{S.uv=id;render()},
 addProject:()=>projectForm(),editProject:id=>projectForm(byId('Projects',id)),
 delProject:async id=>{const p=byId('Projects',id);if(await confirmModal('Delete Project?',`Delete <b>${esc(p.Name)}</b>? Its items and transactions stay, but are unlinked.`))mutate('deleteProject',[id],'Project deleted')},
 fundProject:async id=>{const p=byId('Projects',id);const v=await formModal('wallet','Save Toward Project',esc(p.Name),[{name:'Amount',label:`Amount (${sym()}) — negative to withdraw`,type:'number',required:true,full:true,placeholder:'0.00'}],{submit:'Add savings'});
  if(v)mutate('fundProject',[id,v.Amount],'Savings updated')},
 addPurchase:pid=>purchaseForm({},pid),editPurchase:id=>purchaseForm(byId('Purchases',id)),
 delPurchase:async id=>{const x=byId('Purchases',id);if(await confirmModal('Delete Planned Purchase?',`Delete <b>${esc(x.Item)}</b>?`))mutate('deletePurchase',[id],'Purchase deleted')},
 fundPurchase:async id=>{const x=byId('Purchases',id);const v=await formModal('wallet','Save Toward Purchase',esc(x.Item),[{name:'Amount',label:`Amount (${sym()}) — negative to withdraw`,type:'number',required:true,full:true,placeholder:'0.00'}],{submit:'Add savings'});
  if(v)mutate('fundPurchase',[id,v.Amount],'Savings updated')},
 buyPurchase:async id=>{const x=byId('Purchases',id);const v=await formModal('check','Mark as Bought',esc(x.Item),[
  {name:'Amount',label:`Actual price (${sym()})`,type:'number',min:0,value:x.EstCost,required:true},{name:'Date',label:'Date',type:'date',value:S.data.today,required:true},
  {name:'Account',label:'Paid from',type:'select',options:accNames(),required:true},{name:'Category',label:'Category',type:'select',options:cats('Expense').map(c=>c.Name),required:true}],
  {submit:'Record purchase',message:'This records the expense in your transactions and marks the item as bought.'});
  if(v)mutate('markPurchaseBought',[id,v],'Purchase recorded')}
};
document.addEventListener('change',e=>{if(e.target.id==='month'&&e.target.value){S.month=e.target.value;render()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||!A[b.dataset.act])return;e.preventDefault();A[b.dataset.act](b.dataset.id,b)});

/* ================================================================
   Boot
   ================================================================ */
$('mb').innerHTML=ic('menu',22);$('logo').innerHTML=ic('wallet',24);$('tbAdd').innerHTML=ic('plus',18)+'<span>Add transaction</span>';
setInterval(async()=>{if(S.tab!=='inbox'||!S.data||document.hidden||BUSY||$('modal').classList.contains('open'))return;
 const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;
 try{const d=await run('refreshData');if(S.tab==='inbox'&&!$('modal').classList.contains('open')){S.data=d;render()}}catch(e){}},60000);
(async function init(){
 const slow=setTimeout(()=>{if(!S.data)V(`<div class="card"><div class="empty">Still loading… The first open after an update can take up to a minute while the data sheet is prepared.<br>If this doesn't change, reload the page.</div></div>`)},25000);
 try{S.data=await run('getData');clearTimeout(slow);S.month=S.data.today.slice(0,7);render()}
 catch(e){clearTimeout(slow);V(`<div class="card"><div class="empty"><b>Could not load your data</b><br>${esc((e&&e.message)||e)}</div></div>`)}})();
})();
</script>
